<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>言葉のライフゲーム</title>
<style>
  :root{
    --bg:#fbfaf6;
    --ink:#2a2a28;
    --ink-faint:rgba(42,42,40,0.38);
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
  }
  canvas{ display:block; touch-action:none; }

  #overlay{
    position:fixed; inset:0; z-index:20;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:opacity 1.4s ease;
  }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  .poem{
    display:flex; flex-direction:row-reverse; gap:1.6em;
  }
  .poem span{
    writing-mode:vertical-rl;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:clamp(15px,2.1vw,19px);
    line-height:2.3; letter-spacing:0.18em;
    color:var(--ink); opacity:0.82;
  }
  .hint{
    position:absolute; bottom:9vh; left:0; right:0;
    text-align:center;
    font-size:11px; letter-spacing:0.32em;
    color:var(--ink-faint);
  }
  #touchHint{
    position:fixed; left:0; right:0; bottom:7vh; z-index:4;
    text-align:center; font-size:11px; letter-spacing:0.28em;
    color:var(--ink-faint);
    opacity:0; display:none;
    transition:opacity 1s ease;
    pointer-events:none;
  }

  #hud{
    position:fixed; left:18px; bottom:16px; z-index:5;
    font-size:11px; letter-spacing:0.18em; color:var(--ink-faint);
    display:none; user-select:none;
  }
  #muteBtn{
    position:fixed; right:18px; bottom:16px; z-index:5;
    width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(42,42,40,0.22); background:transparent;
    color:var(--ink-faint); font-size:14px;
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #muteBtn:hover{ border-color:rgba(42,42,40,0.4); color:var(--ink); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="overlay">
  <div class="poem">
    <span>白い余白に、</span>
    <span>言葉が浮かぶ。</span>
    <span>偶然と必然が、</span>
    <span>束の間の詩を紡ぐ。</span>
  </div>
  <div class="hint">触れて、はじめる</div>
</div>

<div id="hud">世代 <span id="gen">0</span> ・ <span id="pop">0</span>語</div>
<button id="muteBtn" aria-label="音を切り替える">♪</button>
<div id="touchHint">言葉に触れると、増殖する</div>

<script>
(function(){
  "use strict";

  const WORDS = [
    "雨","光","波","夜","海","影","炎","霧","闇","樹","苔","塵",
    "存在","記憶","沈黙","痕跡","螺旋","反復","境界","呼吸","残響","余白","無限","消滅","胎動","忘却",
    "構造","鏡像","器官","差異","閾","無意識","現存在","他者","言語","記述","祈り",
    "気配","菌糸","風化","灰","琥珀","水脈","褶曲","裂け目","鼓膜","体温",
    "漂流","堆積","深淵","真空","星屑","鉱石","余燼","微睡み","恩寵","潜勢",
    "偶然","必然","虚無","空白","空洞","深層","表層","地平","地層","接続",
    "特異点","特異性","重力","密度","粒子","波紋","位相","臨界","現勢",
    "運命","自由","生成","変容","断絶","接触","関係","名残","細胞","血管",
    "傷跡","瘢痕","息吹","微熱","精神","幻影","残像","幻視","幻聴","夢",
    "覚醒","恍惚","郷愁","孤独","憂鬱","畏怖","希求","衝動","欠如","渇望",
    "赦し","慈悲"
  ];

  const PREFIXES = [
    "透明な","残酷な","不在の","静かな","構造としての","崩壊する","記述された",
    "名もなき","忘れられた","漂流する","ひび割れた","眠れる","濡れた","乾いた",
    "揺らぐ","沈んだ","燃え尽きた","青白い","かすかな","遠い","深い","虚ろな",
    "裂けた","螺旋状の","折り重なる","反転した","終わりなき","未完成の","匿名の",
    "失われた","生成する","溶解する","風化した","沈黙する","滲む","反射する",
    "胎動する","無数の","最後の","最初の"
  ];

  const SUFFIXES = [
    "をし続ける私","の彼方","を反復する","と他者","の限界","の残響","をまなざす",
    "へ還る","に沈む","を抱く","へ漂う","を忘れる","を呼ぶ","を待つ","を拒む",
    "を照らす","に触れる","から零れる","に溶ける","を夢見る","へ消える",
    "を記憶する","を見失う","として存在する","であり続ける",
    "の裂け目","の深淵","の気配","の影","の痕跡","の静寂","の輪郭",
    "に名前はない","だけが残る","はまだ終わらない"
  ];

  const CONNECTORS = [
    "の","と","へ","より","さえ","なす","たる","なる","は","、",
    "に","で","から","まで","すら","だけ","しかし","そして","あるいは","なお",
    "ただ","まだ","また","もし","ゆえに","として","によって","について",
    "さながら","ある","ない","という","なき","ゆえの"
  ];

  const SOFT_LINKS = ["の","と","という","のような","としての","に","へ","から"];

  const VERBS = [
    "漂う","滲む","崩れる","眠る","燃える","消える","沈む","芽吹く","ほどける",
    "風化する","反響する","侵食する","折り重なる","増殖する","忘れる","祈る",
    "呼吸する","融ける","循環する","響く"
  ];

  const rand = (a,b)=>a+Math.random()*(b-a);
  const pick = (arr)=>arr[(Math.random()*arr.length)|0];
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const charLen = (t)=>Array.from(t).length;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = innerWidth, H = innerHeight;
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let entities = [];
  let sparks = [];
  let fusedCount = 0;

  function seedText(){
    const r = Math.random();
    if (r < 0.22) return pick(WORDS);
    if (r < 0.42) return pick(PREFIXES) + pick(WORDS);
    if (r < 0.60) return pick(WORDS) + pick(SUFFIXES);
    if (r < 0.74) return pick(WORDS) + "が" + pick(VERBS);
    if (r < 0.86) return pick(WORDS) + "の" + pick(WORDS);
    if (r < 0.93) return pick(WORDS) + "と" + pick(WORDS);
    return pick(PREFIXES) + pick(WORDS) + "が" + pick(VERBS);
  }

  function trimText(text, maxLen){
    const chars = Array.from(text);
    if (chars.length <= maxLen) return text;
    return chars.slice(0, maxLen).join('');
  }

  function makeEntity(text, x, y, fusions, vx, vy){
    const len = charLen(text);
    // 少し小さめの当たり判定で、画面により多く並べる
    const r = 22 + len * 3.4 + fusions * 3.5;
    return {
      text, x, y, r, fusions,
      vx: (vx!==undefined) ? vx : rand(-0.07,0.07),
      vy: (vy!==undefined) ? vy : -(rand(0.08,0.22) + fusions*0.012) * (reduceMotion?0.5:1),
      hue: rand(0,360),
      phase: rand(0, Math.PI*2),
      born: performance.now(),
      life: rand(20000, 32000) + fusions * 4500 + len * 280,
      alpha: 0,
      consumed: false,
      collapsing: false,
      collapseStart: 0,
      collapseDuration: 0,
      nextPeel: 0,
      peelInterval: 0,
      lastInteraction: 0,
      hitLeft: false,
      hitRight: false,
      hitTop: false,
      hitBottom: false
    };
  }

  function spawnPrimordial(){
    const margin = 50;
    const side = (Math.random() * 4) | 0;
    let x, y, vx, vy;
    const speed = rand(0.10, 0.26) * (reduceMotion ? 0.5 : 1);
    const drift = rand(-0.14, 0.14);

    if (side === 0) {
      x = rand(0, W); y = -margin - rand(0, 30);
      vx = drift; vy = speed;
    } else if (side === 1) {
      x = W + margin + rand(0, 30); y = rand(0, H);
      vx = -speed; vy = drift;
    } else if (side === 2) {
      x = rand(0, W); y = H + margin + rand(0, 30);
      vx = drift; vy = -speed;
    } else {
      x = -margin - rand(0, 30); y = rand(0, H);
      vx = speed; vy = drift;
    }
    entities.push(makeEntity(seedText(), x, y, 0, vx, vy));
  }

  // 画面内にも直接湧かせて密度を稼ぐ
  function spawnInside(){
    const x = rand(W * 0.08, W * 0.92);
    const y = rand(H * 0.08, H * 0.92);
    const e = makeEntity(seedText(), x, y, 0, rand(-0.12,0.12), rand(-0.12,0.12));
    e.alpha = 0;
    entities.push(e);
  }

  function combine(a, b){
    const patterns = [
      () => a + "の" + b,
      () => a + "と" + b,
      () => a + "という" + b,
      () => a + "のような" + b,
      () => a + "が" + pick(VERBS),
      () => pick(PREFIXES) + a,
      () => a + pick(SUFFIXES),
      () => b + "の" + a,
      () => a + "、" + b,
      () => a + pick(SOFT_LINKS) + b
    ];
    let text = pick(patterns)();
    text = trimText(text, 22);
    if (charLen(text) < 2) text = a + "の" + b;
    return text;
  }

  /* ---------- 音：たまにだけ、金属寄り ---------- */
  let audioEnabled = false;
  let voices = [];
  let lastSingAt = 0;
  function loadVoices(){ voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : []; }
  if ('speechSynthesis' in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickMetallicVoice(jaVoices){
    if (!jaVoices.length) return null;
    const metallic = jaVoices.filter(v =>
      /Google|Compact|Haruka|Ayumi|Ichiro|Otoya|Microsoft|SAPI|Yun|Nanami/i.test(v.name)
    );
    const others = jaVoices.filter(v => !metallic.includes(v));
    if (metallic.length && Math.random() < 0.75) return pick(metallic);
    if (others.length && Math.random() < 0.5) return pick(others);
    return metallic.length ? pick(metallic) : pick(jaVoices);
  }

  // chance: 読む確率。成立のたびに呼ばず、間引きする
  function sing(text, chance){
    if (!audioEnabled || !('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking) return;
    if (Math.random() > (chance == null ? 0.12 : chance)) return;
    const now = performance.now();
    if (now - lastSingAt < 2200) return; // 最低間隔
    try{
      const u = new SpeechSynthesisUtterance(text);
      const jaVoices = voices.filter(v => /ja/i.test(v.lang));
      const v = pickMetallicVoice(jaVoices);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'ja-JP'; }
      u.pitch = rand(1.45, 1.95);
      u.rate  = rand(0.88, 1.18);
      u.volume = rand(0.42, 0.68);
      speechSynthesis.speak(u);
      lastSingAt = now;
    }catch(e){ }
  }

  function drawPunctationMark(ch, cellX, cellY, fontSize){
    const px = cellX + fontSize * 0.28;
    const py = cellY - fontSize * 0.30;
    const r = Math.max(1.3, fontSize * 0.075);
    if (ch === '。'){
      ctx.beginPath();
      ctx.arc(px, py, r * 1.15, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = Math.max(1.1, fontSize * 0.055);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px + r * 0.15, py + r * 0.2);
    ctx.quadraticCurveTo(
      px + fontSize * 0.10, py + fontSize * 0.08,
      px + fontSize * 0.06, py + fontSize * 0.16
    );
    ctx.stroke();
    ctx.restore();
  }

  function drawWord(e){
    const maxFontSize = clamp(e.r * 0.50, 14, 30);
    const len = charLen(e.text);
    const fontSize = len > 12 ? maxFontSize * 0.82 : (len > 8 ? maxFontSize * 0.90 : maxFontSize);

    ctx.save();
    ctx.globalAlpha = e.alpha;
    ctx.fillStyle = '#2a2a28';
    ctx.font = `${fontSize}px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(251,250,246,0.75)';
    ctx.shadowBlur = 3;

    const chars = Array.from(e.text);
    const lineH = fontSize * 1.12;
    const totalH = chars.length * lineH;
    let y0 = e.y - totalH/2 + lineH/2;
    chars.forEach((ch,i)=>{
      const cy = y0 + i * lineH;
      if (ch === '、' || ch === '。') drawPunctationMark(ch, e.x, cy, fontSize);
      else ctx.fillText(ch, e.x, cy);
    });
    ctx.restore();
  }

  const MAX_POP = 160;
  let lastRuleTick = 0;
  let lastFusionTick = 0;
  let lastSpawnTick = 0;
  let lastMutationTick = 0;
  const genEl = document.getElementById('gen');
  const popEl = document.getElementById('pop');

  function applyLifeRules(now){
    const R = 120;
    for (let i=0;i<entities.length;i++){
      const e = entities[i];
      if (e.consumed || e.collapsing) continue;
      let neighbors = 0;
      for (let j=0;j<entities.length;j++){
        if (i===j) continue;
        const o = entities[j];
        if (o.consumed || o.collapsing) continue;
        const dx=e.x-o.x, dy=e.y-o.y;
        if (dx*dx+dy*dy < R*R) neighbors++;
      }
      const age = now - e.born;
      if (neighbors===0 && age>7000){
        e.life = Math.min(e.life, age+2400);
      } else if (neighbors>=10){
        e.life = Math.min(e.life, age+2000);
      } else if (neighbors>=1 && neighbors<=6){
        e.life += 480;
      }
    }
  }

  function applyMutations(now){
    for (let i=0;i<entities.length;i++){
      const e = entities[i];
      if (e.consumed || e.collapsing || charLen(e.text) > 18) continue;
      const age = now - e.born;
      if (age > 1600 && Math.random() < 0.09) {
        const r = Math.random();
        if (r < 0.28) e.text = pick(PREFIXES) + e.text;
        else if (r < 0.52) e.text = e.text + pick(SUFFIXES);
        else if (r < 0.72) e.text = e.text + "が" + pick(VERBS);
        else if (r < 0.86) e.text = e.text + "の" + pick(WORDS);
        else e.text = pick(WORDS) + "と" + e.text;

        e.text = trimText(e.text, 22);
        e.r = 22 + charLen(e.text)*3.4 + e.fusions*3.5;
        e.life += 4800;
        sing(e.text, 0.08);
        for(let j=0; j<2; j++) {
          const ch = Array.from(e.text)[j % Math.max(1, charLen(e.text))] || "・";
          spawnSparks({text: ch, x:e.x, y:e.y, hue:e.hue}, true);
        }
      }
    }
  }

  function applyInteractions(now){
    for (let i=0;i<entities.length;i++){
      const a = entities[i];
      if (a.consumed || a.collapsing) continue;
      if (now - a.lastInteraction < 1400) continue;

      for (let j=i+1;j<entities.length;j++){
        const b = entities[j];
        if (b.consumed || b.collapsing) continue;
        if (now - b.lastInteraction < 1400) continue;

        const dx=a.x-b.x, dy=a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);

        if (dist < (a.r+b.r)*0.50){
          const randAction = Math.random();

          if (randAction < 0.18) {
            a.lastInteraction = now;
            b.lastInteraction = now;

          } else if (randAction < 0.48) {
            if (charLen(a.text) < 16 && charLen(b.text) < 16) {
              const bHead = Array.from(b.text)[0];
              const aHead = Array.from(a.text)[0];
              a.text = trimText(a.text + "の" + bHead, 20);
              b.text = trimText(aHead + "と" + b.text, 20);
              a.lastInteraction = now;
              b.lastInteraction = now;
              a.r += 5; b.r += 5;
              sing(a.text, 0.06);
            }

          } else {
            // 統合：子を生むだけでなく、親も残す確率を持たせて密度維持
            if (a.fusions < 8 && b.fusions < 8) {
              const text = combine(a.text, b.text);
              if (charLen(text) <= 22 && entities.length < MAX_POP + 8){
                const cvx = (a.vx+b.vx)/2;
                const cvy = (a.vy+b.vy)/2;
                const child = makeEntity(text, (a.x+b.x)/2, (a.y+b.y)/2, Math.max(a.fusions,b.fusions)+1, cvx, cvy);
                entities.push(child);
                fusedCount++;
                genEl.textContent = fusedCount;
                sing(text, 0.10);

                // 60%で片方だけ消え、40%で両方残る（文章が増えやすい）
                const fate = Math.random();
                if (fate < 0.30) {
                  a.consumed = true;
                } else if (fate < 0.60) {
                  b.consumed = true;
                }
                a.lastInteraction = now;
                b.lastInteraction = now;
              }
            }
          }
          break;
        }
      }
    }
  }

  function handleEdges(e){
    const pad = Math.max(10, e.r * 0.7);
    const outer = e.r + 70;
    let remove = false;

    if (e.x <= pad) {
      if (!e.hitLeft) {
        e.hitLeft = true;
        if (Math.random() < 0.40) {
          e.vx = Math.abs(e.vx) * rand(0.85, 1.2) + rand(0.02, 0.08);
          e.x = pad;
          e.hitLeft = false;
        }
      }
      if (e.x < -outer) remove = true;
    } else e.hitLeft = false;

    if (e.x >= W - pad) {
      if (!e.hitRight) {
        e.hitRight = true;
        if (Math.random() < 0.40) {
          e.vx = -Math.abs(e.vx) * rand(0.85, 1.2) - rand(0.02, 0.08);
          e.x = W - pad;
          e.hitRight = false;
        }
      }
      if (e.x > W + outer) remove = true;
    } else e.hitRight = false;

    if (e.y <= pad) {
      if (!e.hitTop) {
        e.hitTop = true;
        if (Math.random() < 0.40) {
          e.vy = Math.abs(e.vy) * rand(0.85, 1.2) + rand(0.02, 0.08);
          e.y = pad;
          e.hitTop = false;
        }
      }
      if (e.y < -outer) remove = true;
    } else e.hitTop = false;

    if (e.y >= H - pad) {
      if (!e.hitBottom) {
        e.hitBottom = true;
        if (Math.random() < 0.40) {
          e.vy = -Math.abs(e.vy) * rand(0.85, 1.2) - rand(0.02, 0.08);
          e.y = H - pad;
          e.hitBottom = false;
        }
      }
      if (e.y > H + outer) remove = true;
    } else e.hitBottom = false;

    return remove;
  }

  function beginCollapse(e, now){
    e.collapsing = true;
    e.collapseStart = now;
    const len = Math.max(1, charLen(e.text));
    const base = reduceMotion ? 320 : 200;
    e.peelInterval = base + rand(60, 280) + e.fusions * 70 + len * 22;
    e.collapseDuration = e.peelInterval * len * rand(1.2, 2.0) + rand(600, 1600);
    e.nextPeel = now + rand(80, e.peelInterval * 0.5);
    e.vx *= 0.7;
    e.vy *= 0.7;
  }

  function peelCharacter(e, now){
    const chars = Array.from(e.text);
    if (!chars.length) return;
    let idx;
    if (chars.length <= 2 || Math.random() < 0.75){
      idx = Math.random() < 0.5 ? 0 : chars.length - 1;
    } else {
      idx = 1 + ((Math.random() * (chars.length - 2)) | 0);
    }
    const ch = chars.splice(idx, 1)[0];
    e.text = chars.join('');
    e.r = Math.max(14, 22 + charLen(e.text)*3.4 + e.fusions*3.5);

    const ang = rand(0, Math.PI*2);
    const speed = rand(0.08, 0.28);
    const ox = e.x + rand(-6, 6);
    const oy = e.y + rand(-6, 6);

    sparks.push({
      ch, x: ox, y: oy,
      vx: Math.cos(ang)*speed + e.vx*0.3,
      vy: Math.sin(ang)*speed + e.vy*0.3 - 0.01,
      born: now,
      life: rand(2600, 5200) + e.fusions*220,
      hue: e.hue
    });

    if (ch !== '、' && ch !== '。' && Math.random() < 0.48 && entities.length < MAX_POP + 20){
      const frag = makeEntity(ch, ox, oy, 0,
        Math.cos(ang)*rand(0.15, 0.45),
        Math.sin(ang)*rand(0.15, 0.45) - rand(0.02, 0.08)
      );
      frag.life = rand(5000, 11000) + e.fusions*500;
      frag.born = now;
      entities.push(frag);
    }
    e.nextPeel = now + e.peelInterval * rand(0.55, 1.25);
  }

  function dissolveWord(e){
    const now = performance.now();
    Array.from(e.text).forEach(ch=>{
      const ang = rand(0, Math.PI*2);
      const speed = rand(0.04, 0.14);
      sparks.push({
        ch, x:e.x, y:e.y,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed - 0.015,
        born: now,
        life: rand(3000, 5200),
        hue: e.hue
      });
    });
  }

  let running = false;
  let lastFrame = 0;
  function frame(now){
    if (!running) return;
    const dt = Math.min(now-lastFrame, 48);
    lastFrame = now;

    // 高密度スポーン：辺から＋画面内
    if (now-lastSpawnTick > (reduceMotion?700:320)){
      lastSpawnTick = now;
      if (entities.length < MAX_POP){
        const lack = MAX_POP - entities.length;
        const burst = lack > MAX_POP * 0.5 ? 4 : (lack > MAX_POP * 0.25 ? 3 : 2);
        for (let k=0;k<burst;k++){
          if (entities.length >= MAX_POP) break;
          if (Math.random() < 0.55) spawnPrimordial();
          else spawnInside();
        }
      }
    }
    if (now-lastRuleTick > 500){ lastRuleTick = now; applyLifeRules(now); }
    if (now-lastFusionTick > 220){ lastFusionTick = now; applyInteractions(now); }
    if (now-lastMutationTick > 700){ lastMutationTick = now; applyMutations(now); }

    ctx.fillStyle = 'rgba(251,250,246,0.12)';
    ctx.fillRect(0,0,W,H);

    for (let i=entities.length-1;i>=0;i--){
      const e = entities[i];
      const age = now-e.born;

      if (e.consumed){ entities.splice(i,1); continue; }

      if (!e.collapsing && age >= e.life) beginCollapse(e, now);

      if (e.collapsing){
        if (e.text.length > 0 && now >= e.nextPeel) peelCharacter(e, now);
        const t = (now - e.collapseStart) / Math.max(1, e.collapseDuration);
        e.alpha = clamp(1 - t*0.85, 0.12, 0.85) * (e.text.length === 0 ? 0 : 1);
        e.x += e.vx*dt*0.08 + Math.sin(now/1500 + e.phase)*0.10;
        e.y += e.vy*dt*0.08;
        if (handleEdges(e)){ entities.splice(i,1); continue; }
        if (e.text.length > 0) drawWord(e);
        if (e.text.length === 0 || t >= 1){
          if (e.text.length > 0) dissolveWord(e);
          entities.splice(i,1);
        }
        continue;
      }

      e.x += e.vx*dt*0.10 + Math.sin(now/1500 + e.phase)*0.12;
      e.y += e.vy*dt*0.10;
      if (handleEdges(e)){ entities.splice(i,1); continue; }

      const fadeIn = clamp(age/600, 0, 1);
      const fadeOut = clamp((e.life-age)/2000, 0, 1);
      e.alpha = Math.min(fadeIn, fadeOut) * 0.90;
      drawWord(e);
    }

    for (let i=sparks.length-1;i>=0;i--){
      const s = sparks[i];
      const age = now - s.born;
      if (age >= s.life){ sparks.splice(i,1); continue; }
      s.x += s.vx*dt*0.05;
      s.y += s.vy*dt*0.05;
      s.vx *= 0.98; s.vy = s.vy*0.98 - 0.001;
      ctx.save();
      ctx.globalAlpha = clamp(1 - (age / s.life), 0, 1) * 0.85;
      ctx.fillStyle = `hsla(${s.hue},30%,40%,1)`;
      if (s.ch === '、' || s.ch === '。'){
        drawPunctationMark(s.ch, s.x, s.y, 15);
      } else {
        ctx.font = '15px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.ch, s.x, s.y);
      }
      ctx.restore();
    }

    popEl.textContent = entities.length;
    requestAnimationFrame(frame);
  }

  const PROLIFERATE_CHANCE = 0.90;

  function splitWord(text){
    const chars = Array.from(text);
    if (chars.length <= 1) return [text, text];
    const parts = [];
    let i = 0;
    while (i < chars.length){
      const len = Math.min(chars.length-i, (Math.random()<0.45) ? 1 : 2);
      parts.push(chars.slice(i,i+len).join(''));
      i += len;
    }
    return parts;
  }

  function spawnSparks(e, smallSpark = false){
    const now = performance.now();
    Array.from(e.text || "　").forEach(ch=>{
      const ang = rand(0,Math.PI*2);
      sparks.push({
        ch, x:e.x, y:e.y,
        vx:Math.cos(ang)*(smallSpark ? rand(0.1,0.5) : rand(0.3,1.2)),
        vy:Math.sin(ang)*(smallSpark ? rand(0.1,0.5) : rand(0.3,1.2)),
        born:now,
        life: smallSpark ? rand(1000,2000) : rand(3000,7000),
        hue:e.hue || rand(0,360)
      });
    });
  }

  function scatterWord(e){
    if (e.collapsing) return;
    const now = performance.now();
    beginCollapse(e, now);
    e.peelInterval *= 0.45;
    e.collapseDuration *= 0.55;
    e.nextPeel = now;

    if (Math.random() < PROLIFERATE_CHANCE){
      splitWord(e.text).slice(0,7).forEach(frag=>{
        if (entities.length >= MAX_POP+24) return;
        const ang = rand(0,Math.PI*2);
        const child = makeEntity(frag, e.x, e.y, Math.max(0, e.fusions-1));
        child.vx = Math.cos(ang)*rand(0.2,0.6);
        child.vy = -rand(0.05,0.15);
        child.life = rand(22000, 34000);
        entities.push(child);
        fusedCount++;
      });
      genEl.textContent = fusedCount;
    }
  }

  function handlePointer(ev){
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    for (let i=entities.length-1;i>=0;i--){
      const e = entities[i];
      if (e.consumed || e.collapsing) continue;
      const dx=x-e.x, dy=y-e.y;
      if (dx*dx+dy*dy <= (e.r*1.15)*(e.r*1.15)){
        scatterWord(e); break;
      }
    }
  }
  canvas.addEventListener('pointerdown', handlePointer);

  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  const muteBtn = document.getElementById('muteBtn');
  let started = false;

  function start(){
    if (started) return;
    started = true;
    audioEnabled = true;
    overlay.classList.add('hidden');
    hud.style.display = 'block';
    muteBtn.style.display = 'flex';
    running = true;
    lastFrame = performance.now();
    lastSpawnTick = lastFrame; lastRuleTick = lastFrame; lastFusionTick = lastFrame; lastMutationTick = lastFrame;

    // 開始直後から画面を埋める
    for (let i=0;i<28;i++) spawnPrimordial();
    for (let i=0;i<18;i++) spawnInside();
    requestAnimationFrame(frame);

    const touchHint = document.getElementById('touchHint');
    touchHint.style.display = 'block';
    requestAnimationFrame(()=>{ touchHint.style.opacity = '1'; });
    setTimeout(()=>{
      touchHint.style.opacity = '0';
      setTimeout(()=>{ touchHint.style.display = 'none'; }, 1000);
    }, 5000);
  }
  overlay.addEventListener('click', start);
  overlay.addEventListener('touchstart', start, {passive:true});

  muteBtn.addEventListener('click', ()=>{
    audioEnabled = !audioEnabled;
    muteBtn.textContent = audioEnabled ? '♪' : '×';
    if (!audioEnabled && 'speechSynthesis' in window) speechSynthesis.cancel();
  });

})();
</script>
</body>
</html>
